{% extends "base.html" %}
{% block title %}{{ user_obj.get_full_name }} — Inkboard{% endblock %}
{% block content %}
<div class="container" style="padding-top:var(--space-10);">
  <h1 class="heading-1">{{ user_obj.get_full_name|default:user_obj.username }}</h1>
  <p class="badge badge--neutral" style="margin-top:var(--space-3);">{{ user_obj.get_role_display }}</p>
</div>
{% endblock %}
