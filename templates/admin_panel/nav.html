<!-- templates/admin_panel/nav.html -->
<style>
.admin-nav-bar {
  margin-bottom: var(--space-8);
  border-bottom: 2px solid var(--color-border);
  padding-bottom: 0;
}
.admin-nav-inner {
  display: flex;
  gap: var(--space-4);
  overflow-x: auto;
  align-items: flex-end;
}
.admin-nav-link {
  padding: var(--space-2) var(--space-4);
  font-size: var(--text-sm);
  font-weight: 600;
  text-decoration: none;
  border-bottom: 3px solid transparent;
  color: var(--color-text-secondary);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  transition: color var(--duration-fast), border-color var(--duration-fast);
}
.admin-nav-link:hover {
  color: var(--color-text-primary);
}
.admin-nav-link--active {
  border-bottom-color: var(--color-primary);
  color: var(--color-primary);
}
</style>

<div class="admin-nav-bar">
  <div class="admin-nav-inner">
    <a href="{% url 'core:admin_panel' %}"
       class="admin-nav-link {% if active_tab == 'overview' %}admin-nav-link--active{% endif %}">
      📊 Overview
    </a>
    <a href="{% url 'core:admin_users' %}"
       class="admin-nav-link {% if active_tab == 'users' %}admin-nav-link--active{% endif %}">
      👥 User Management
    </a>
    <a href="{% url 'core:admin_verifications' %}"
       class="admin-nav-link {% if active_tab == 'verifications' %}admin-nav-link--active{% endif %}">
      ⏳ Employer Verification
    </a>
    <a href="{% url 'core:admin_jobs' %}"
       class="admin-nav-link {% if active_tab == 'jobs' %}admin-nav-link--active{% endif %}">
      💼 Job Moderation
    </a>
    <a href="{% url 'core:admin_audit_log' %}"
       class="admin-nav-link {% if active_tab == 'audit' %}admin-nav-link--active{% endif %}">
      📜 Audit Log
    </a>
  </div>
</div>
