<!-- templates/admin_panel/nav.html -->
<style>
.admin-nav-bar {
  margin-bottom: var(--space-8);
  border-bottom: 2px solid var(--color-border);
  padding-bottom: 0;
}
.admin-nav-inner {
  display: flex;
  gap: var(--space-4);
  overflow-x: auto;
  align-items: flex-end;
}
.admin-nav-link {
  padding: var(--space-2) var(--space-4);
  font-size: var(--text-sm);
  font-weight: 600;
  text-decoration: none;
  border-bottom: 3px solid transparent;
  color: var(--color-text-secondary);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  transition: color var(--duration-fast), border-color var(--duration-fast);
}
.admin-nav-link:hover {
  color: var(--color-text-primary);
}
.admin-nav-link--active {
  border-bottom-color: var(--color-primary);
  color: var(--color-primary);
}
</style>

<div class="admin-nav-bar">
  <div class="admin-nav-inner">
    <a href="{% url 'core:admin_panel' %}"
       class="admin-nav-link {% if active_tab == 'overview' %}admin-nav-link--active{% endif %}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      <span>Overview</span>
    </a>
    <a href="{% url 'core:admin_users' %}"
       class="admin-nav-link {% if active_tab == 'users' %}admin-nav-link--active{% endif %}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>User Management</span>
    </a>
    <a href="{% url 'core:admin_verifications' %}"
       class="admin-nav-link {% if active_tab == 'verifications' %}admin-nav-link--active{% endif %}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>
      <span>Employer Verification</span>
    </a>
    <a href="{% url 'core:admin_jobs' %}"
       class="admin-nav-link {% if active_tab == 'jobs' %}admin-nav-link--active{% endif %}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      <span>Job Moderation</span>
    </a>
    <a href="{% url 'core:admin_audit_log' %}"
       class="admin-nav-link {% if active_tab == 'audit' %}admin-nav-link--active{% endif %}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span>Audit Log</span>
    </a>
  </div>
</div>
