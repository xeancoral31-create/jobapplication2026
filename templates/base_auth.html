{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}WorkWise{% endblock %}</title>
  <meta name="description" content="{% block description %}WorkWise — modern job board platform.{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/inkboard.css' %}">
  <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('workwise_theme');
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        const theme = saved ? saved : (prefersLight ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <style>
    /* ── Auth layout reset ───────────────────────────────────── */
    html, body { height: 100%; margin: 0; }
    body { background: var(--color-bg); font-family: var(--font-sans); }

    /* ── Split screen ────────────────────────────────────────── */
    .auth-shell {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100dvh;
    }
    @media (max-width: 768px) {
      .auth-shell { grid-template-columns: 1fr; }
      .auth-left  { display: none; }
    }

    /* ── Left panel ──────────────────────────────────────────── */
    .auth-left {
      position: relative;
      background-color: hsl(230 25% 7%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 4rem 3.5rem;
      min-height: 100%;
      height: 100%;
    }
    .auth-left--plum { background-color: hsl(270 30% 6%); }

    /* When bottom stats block exists (e.g. admin login) */
    .auth-left:has(.auth-stats) {
      justify-content: space-between;
      align-items: stretch;
    }
    .auth-left:has(.auth-stats) .auth-left__content {
      margin: 0;
    }

    /* dot grid */
    .auth-left::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(hsl(248 60% 70% / 0.16) 1.5px, transparent 1.5px);
      background-size: 28px 28px;
      pointer-events: none;
    }
    .auth-left--plum::before {
      background-image: radial-gradient(hsl(270 60% 70% / 0.15) 1.5px, transparent 1.5px);
    }
    /* ambient glow orb behind centered content */
    .auth-left::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 65%;
      aspect-ratio: 1;
      background: radial-gradient(circle, hsl(248 78% 55% / 0.18), hsl(190 85% 50% / 0.08) 45%, transparent 70%);
      pointer-events: none;
    }
    .auth-left--plum::after {
      background: radial-gradient(circle, hsl(270 70% 55% / 0.2), transparent 70%);
    }

    .auth-left__content {
      position: relative;
      z-index: 1;
      max-width: 480px;
      width: 100%;
      margin: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: left;
    }
    .auth-brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: #ffffff;
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      margin-bottom: 2.5rem;
    }
    .auth-brand__mark {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      object-fit: cover;
      display: inline-block;
      box-shadow: 0 0 20px rgba(129, 140, 248, 0.45), 0 0 10px rgba(56, 189, 248, 0.35);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
    }
    .auth-brand:hover .auth-brand__mark {
      transform: scale(1.08);
      box-shadow: 0 0 26px rgba(129, 140, 248, 0.65), 0 0 14px rgba(56, 189, 248, 0.5);
    }

    .auth-headline {
      margin-top: 0;
    }
    .auth-headline h1 {
      font-family: 'Sora', sans-serif;
      font-size: clamp(2.5rem, 3.8vw, 3.35rem);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.035em;
      color: #ffffff;
      margin: 0 0 1.35rem;
    }
    .auth-headline h1 em {
      font-style: normal;
      background: linear-gradient(135deg, #a78bfa 0%, #38bdf8 55%, #2dd4bf 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-block;
      filter: drop-shadow(0 2px 18px rgba(56, 189, 248, 0.35));
    }
    .auth-left--plum .auth-headline h1 em {
      background: linear-gradient(120deg, hsl(270 80% 80%) 0%, hsl(300 60% 75%) 100%);
      -webkit-background-clip: text;
      background-clip: text;
    }
    .auth-sub {
      color: #94a3b8;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 1.05rem;
      line-height: 1.65;
      margin: 0;
      max-width: 440px;
      font-weight: 400;
    }

    .auth-stats {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 2rem;
    }
    .auth-stat__num {
      display: block;
      font-family: 'Sora', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.03em;
    }
    .auth-stat__label {
      display: block;
      font-size: 0.78rem;
      color: hsl(230 20% 52%);
      margin-top: 2px;
    }

    /* ── Right panel / form ──────────────────────────────────── */
    .auth-right {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem;
      background: var(--color-bg);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
    }

    /* ── Role tabs ───────────────────────────────────────────── */
    .auth-tabs {
      display: flex;
      gap: 0;
      background: var(--color-surface-2);
      border-radius: var(--radius-lg);
      padding: 4px;
      margin-bottom: 2rem;
    }
    .auth-tab {
      flex: 1;
      padding: 0.55rem 1rem;
      border: none;
      border-radius: calc(var(--radius-lg) - 3px);
      background: transparent;
      color: var(--color-text-muted);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s var(--ease-out);
    }
    .auth-tab:hover { color: var(--color-text-secondary); }
    .auth-tab.is-active {
      background: var(--auth-accent, var(--color-accent-500));
      color: #fff;
      box-shadow: 0 2px 8px hsl(0 0% 0% / 0.25);
    }

    /* role-driven color variables with clean default */
    .auth-card {
      width: 100%;
      max-width: 440px;
      --auth-accent: hsl(174 72% 38%);
      --auth-btn: hsl(174 72% 38%);
      --auth-btn-hover: hsl(174 72% 32%);
    }
    .auth-card[data-role="applicant"] { --auth-accent: hsl(174 72% 38%); --auth-btn: hsl(174 72% 38%); --auth-btn-hover: hsl(174 72% 32%); }
    .auth-card[data-role="employer"]  { --auth-accent: hsl(6 78% 58%);   --auth-btn: hsl(6 78% 58%);   --auth-btn-hover: hsl(6 78% 50%); }

    .auth-title {
      font-family: 'Sora', sans-serif;
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #ffffff;
      margin: 0 0 0.4rem;
    }
    .auth-subtitle {
      font-size: 0.975rem;
      color: #94a3b8;
      margin: 0 0 2rem;
    }

    /* ── Form fields ─────────────────────────────────────────── */
    .auth-field { margin-bottom: 1.35rem; }
    .auth-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
      letter-spacing: 0.01em;
    }
    .auth-input {
      width: 100%;
      padding: 0.85rem 1.1rem;
      background: hsl(218 25% 12%);
      border: 1.5px solid hsl(218 20% 24%);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.975rem;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
      box-sizing: border-box;
      outline: none;
    }
    .auth-input:focus {
      border-color: var(--auth-accent, hsl(174 72% 38%));
      box-shadow: 0 0 0 3px hsl(174 72% 38% / 0.2);
    }
    .auth-input::placeholder { color: #64748b; opacity: 0.8; }
    .auth-input.is-invalid { border-color: var(--color-danger); }
    .auth-error { font-size: 0.8rem; color: #f87171; margin-top: 0.35rem; display: block; }

    /* ── Submit button ───────────────────────────────────────── */
    .auth-btn {
      width: 100%;
      padding: 0.85rem 1.5rem;
      background: var(--auth-btn, hsl(174 72% 38%));
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 0.75rem;
      transition: background 0.2s, transform 0.1s;
    }
    .auth-btn:hover  { background: var(--auth-btn-hover, hsl(174 72% 32%)); }
    .auth-btn:active { transform: scale(0.99); }

    /* ── Footer links ────────────────────────────────────────── */
    .auth-footer {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: center;
      text-align: center;
    }
    .auth-footer a {
      font-size: 0.9rem;
      color: #94a3b8;
      text-decoration: none;
      transition: color 0.15s;
    }
    .auth-footer a:hover { color: #ffffff; }
    .auth-footer__main {
      font-size: 0.925rem;
      color: #94a3b8;
      margin: 0;
    }
    .auth-footer__main a {
      color: var(--auth-accent, hsl(174 72% 42%));
      font-weight: 600;
      text-decoration: none;
    }
    .auth-footer__main a:hover {
      text-decoration: underline;
    }

    /* ── Alerts ──────────────────────────────────────────────── */
    .auth-alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }
    .auth-alert--error   { background: hsl(0 78% 55% / 0.12); border: 1px solid hsl(0 78% 55% / 0.3); color: hsl(0 78% 72%); }
    .auth-alert--success { background: hsl(142 60% 45% / 0.12); border: 1px solid hsl(142 60% 45% / 0.3); color: hsl(142 60% 65%); }
    .auth-alert--info    { background: hsl(210 80% 55% / 0.12); border: 1px solid hsl(210 80% 55% / 0.3); color: hsl(210 80% 72%); }

    /* ── Signup-specific: employer expand ────────────────────── */
    .employer-fields { display: none; }
    .auth-card[data-role="employer"] .employer-fields { display: block; }
    .auth-card[data-role="employer"] .auth-title::after { content: ' — Employer'; color: hsl(6 78% 68%); font-size: 1.15rem; font-weight: 600; }
    .auth-pending-note {
      padding: 0.65rem 0.9rem;
      background: hsl(38 90% 55% / 0.12);
      border: 1px solid hsl(38 90% 55% / 0.3);
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      color: hsl(38 90% 70%);
      margin-bottom: 1rem;
    }

    /* ── Field row (first/last name side by side) ────────────── */
    .auth-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 400px) { .auth-row { grid-template-columns: 1fr; } }

    /* ── Divider ─────────────────────────────────────────────── */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }
    .auth-divider span {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  {% if messages %}
  <div style="position:fixed;top:1rem;right:1rem;z-index:9999;display:flex;flex-direction:column;gap:0.5rem;max-width:360px;">
    {% for msg in messages %}
    <div class="auth-alert auth-alert--{{ msg.tags|default:'info' }}" role="alert">{{ msg }}</div>
    {% endfor %}
  </div>
  {% endif %}
  <!-- Floating Theme Toggle for Auth Pages -->
  <div style="position:fixed; top:1.25rem; right:1.25rem; z-index:999;">
    <button type="button" class="btn-theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">
      <span class="theme-icon-sun" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
      </span>
      <span class="theme-icon-moon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
        </svg>
      </span>
    </button>
  </div>

  {% block body %}{% endblock %}

  <script>
    window.toggleTheme = function() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('workwise_theme', next);
    };
  </script>
</body>
</html>
